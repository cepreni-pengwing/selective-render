name: Rendering bug
description: Report incorrect visibility, lighting, shadows, or geometry.
title: "[Rendering] "
labels: [bug, rendering]
body:
  - type: input
    id: versions
    attributes: {label: Exact mod and Minecraft versions}
    validations: {required: true}
  - type: dropdown
    id: renderer
    attributes:
      label: Renderer
      options: [Sodium without Iris, Sodium with Iris shaders]
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected and actual result}
    validations: {required: true}
  - type: textarea
    id: reproduction
    attributes: {label: Minimal reproduction steps and region coordinates}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Screenshots, video, and latest.log link}
