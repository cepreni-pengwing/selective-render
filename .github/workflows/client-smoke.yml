name: Client Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world-join:
    name: Minecraft ${{ matrix.minecraft }} world join
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.20.1
            java: 17
            fabric_api: 0.92.2
            build: ./gradlew build --stacktrace
            jar_dir: build/libs
            sodium: mc1.20.1-0.5.13-fabric
          - minecraft: 1.21.1
            java: 21
            fabric_api: 0.116.17
            build: ./gradlew -p versions/mc1.21.1 build --stacktrace
            jar_dir: versions/mc1.21.1/build/libs
            sodium: mc1.21.1-0.8.13-fabric
          - minecraft: 26.2
            java: 25
            fabric_api: 0.159.0
            build: ./versions/mc26.2/gradlew -p versions/mc26.2 build --stacktrace
            jar_dir: versions/mc26.2/build/libs
            sodium: mc26.2-0.9.2-fabric
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build Selective Render
        shell: bash
        run: |
          chmod +x gradlew versions/mc26.2/gradlew
          ${{ matrix.build }}

      - name: Stage Selective Render and Sodium
        shell: bash
        run: |
          mkdir -p run/mods
          jar=$(find '${{ matrix.jar_dir }}' -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          cp "$jar" run/mods/
          curl --fail --location --retry 3 \
            --output "run/mods/sodium-${{ matrix.sodium }}.jar" \
            "https://api.modrinth.com/maven/maven/modrinth/sodium/${{ matrix.sodium }}/sodium-${{ matrix.sodium }}.jar"

      - name: Start client and join a singleplayer world
        uses: headlesshq/mc-runtime-test@fbafe02f89f4f13682e7b16dbcee6b6a43f4faca # 4.5.1
        with:
          mc: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          fabric-api: ${{ matrix.fabric_api }}
          cache-mc: github
          xvfb: true

      - name: Upload client logs and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-smoke-${{ matrix.minecraft }}
          if-no-files-found: ignore
          path: |
            run/logs/
            run/crash-reports/
            run/screenshots/

