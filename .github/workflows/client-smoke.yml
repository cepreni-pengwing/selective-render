name: Client Smoke Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual:
        description: 'Run screenshot and visual simulation tests'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-plan:
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.select.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          VISUAL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          VISUAL_HEAD: ${{ github.sha }}
          VISUAL_REQUESTED: ${{ inputs.visual || false }}
        run: python3 .github/scripts/select-visual-tests.py >> "$GITHUB_OUTPUT"
  world-join:
    needs: test-plan
    name: Minecraft ${{ matrix.minecraft }} / ${{ matrix.profile }} world join
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.20.1
            profile: baseline
            java: 17
            fabric_api: 0.92.2
            build: ./gradlew build --stacktrace
            jar_dir: build/libs
            sodium: mc1.20.1-0.5.13-fabric
          - minecraft: 1.21.1
            profile: baseline
            java: 21
            fabric_api: 0.116.17
            build: ./gradlew -p versions/mc1.21.1 build --stacktrace
            jar_dir: versions/mc1.21.1/build/libs
            sodium: mc1.21.1-0.8.13-fabric
          - minecraft: 26.2
            profile: baseline
            java: 25
            fabric_api: 0.159.0
            build: ./versions/mc26.2/gradlew -p versions/mc26.2 build --stacktrace
            jar_dir: versions/mc26.2/build/libs
            sodium: mc26.2-0.9.2-fabric
          - minecraft: 1.20.1
            profile: worldedit-cui
            java: 17
            fabric_api: 0.92.2
            build: ./gradlew build --stacktrace
            jar_dir: build/libs
            sodium: mc1.20.1-0.5.13-fabric
            worldedit_url: https://cdn.modrinth.com/data/1u6JkXh5/versions/Wrlqaul6/worldedit-mod-7.2.15.jar
            worldedit_sha: 2c41dcd9a622f948ed5409eecc485018fbf274945bdd1a9c0fdf4c4954f9a47dc311e6e0f9e445180d8b771e4a40947533d67bd66feb4ab8c8f87c2880dba7ef
          - minecraft: 1.21.1
            profile: worldedit
            java: 21
            fabric_api: 0.116.17
            build: ./gradlew -p versions/mc1.21.1 build --stacktrace
            jar_dir: versions/mc1.21.1/build/libs
            sodium: mc1.21.1-0.8.13-fabric
            worldedit_url: https://cdn.modrinth.com/data/1u6JkXh5/versions/WTAFvuRx/worldedit-mod-7.3.8.jar
            worldedit_sha: e039492df0b486e7ce76d0eaf8cb11eadad2e78220600b8498ab8eef4642a29e310a6bcb4378257553b3639c6d0bc1ebf0f73df3a7a677c6af6baf86716b0bc7
          - minecraft: 26.2
            profile: worldedit
            java: 25
            fabric_api: 0.159.0
            build: ./versions/mc26.2/gradlew -p versions/mc26.2 build --stacktrace
            jar_dir: versions/mc26.2/build/libs
            sodium: mc26.2-0.9.2-fabric
            worldedit_url: https://cdn.modrinth.com/data/1u6JkXh5/versions/6YnCYPwc/worldedit-mod-7.4.5.jar
            worldedit_sha: 611ff7cc00d78c63a284ef26b6fbc806af295c469375e5e71e4d7e993aa6ea3fa90945e46511c99b6157a01ed5c3868a2a6419b47a38114cc1e67b32c20f7ca3
          - minecraft: 1.20.1
            profile: connected-textures
            java: 17
            fabric_api: 0.92.2
            build: ./gradlew build --stacktrace
            jar_dir: build/libs
            sodium: mc1.20.1-0.5.13-fabric
          - minecraft: 26.1
            profile: patch-sodium08
            java: 25
            fabric_api: 0.155.3
            fabric_api_minecraft: 26.1.2
            build: ./versions/mc26.1/gradlew -p versions/mc26.1 build --stacktrace
            jar_dir: versions/mc26.1/build/libs
            sodium: mc26.1.1-0.8.9-fabric
          - minecraft: 26.1.1
            profile: patch-sodium08
            java: 25
            fabric_api: 0.155.3
            fabric_api_minecraft: 26.1.2
            build: ./versions/mc26.1/gradlew -p versions/mc26.1 build --stacktrace
            jar_dir: versions/mc26.1/build/libs
            sodium: mc26.1.1-0.8.9-fabric
          - minecraft: 26.1.2
            profile: baseline
            java: 25
            fabric_api: 0.155.3
            fabric_api_minecraft: 26.1.2
            build: ./versions/mc26.1/gradlew -p versions/mc26.1 build --stacktrace
            jar_dir: versions/mc26.1/build/libs
            sodium: mc26.1.2-0.9.2-fabric
          - minecraft: 26.1.2
            profile: sodium08
            java: 25
            fabric_api: 0.155.3
            fabric_api_minecraft: 26.1.2
            build: ./versions/mc26.1/gradlew -p versions/mc26.1 build --stacktrace
            jar_dir: versions/mc26.1/build/libs
            sodium: mc26.1.1-0.8.9-fabric
          - minecraft: 26.1.2
            profile: worldedit
            java: 25
            fabric_api: 0.155.3
            fabric_api_minecraft: 26.1.2
            build: ./versions/mc26.1/gradlew -p versions/mc26.1 build --stacktrace
            jar_dir: versions/mc26.1/build/libs
            sodium: mc26.1.2-0.9.2-fabric
            worldedit_url: https://cdn.modrinth.com/data/1u6JkXh5/versions/gjsLvJfW/worldedit-mod-7.4.3.jar
            worldedit_sha: de51a1a319e057f1312ec54de2f08df5d0c00a78718080a3284e0c1ffadffb47d5353e0e538d9334b72eb7260df5a6f2c4bf8373eec8d5a4f6cdfaae1ff4524e
          - minecraft: 26.3
            profile: baseline
            java: 25
            fabric_api: 0.163.0
            build: ./versions/mc26.3/gradlew -p versions/mc26.3 build --stacktrace
            jar_dir: versions/mc26.3/build/libs
            sodium: mc26.3-0.9.2-fabric
          - minecraft: 26.3
            profile: worldedit
            java: 25
            fabric_api: 0.163.0
            build: ./versions/mc26.3/gradlew -p versions/mc26.3 build --stacktrace
            jar_dir: versions/mc26.3/build/libs
            sodium: mc26.3-0.9.2-fabric
            worldedit_url: https://cdn.modrinth.com/data/1u6JkXh5/versions/ByRNkO83/worldedit-mod-7.4.6.jar
            worldedit_sha: 3bc4fbf2ee36746f54dc036283b3ded3f17fd91991eaa1ead76b0861aa902cd7ffbc0962db0065d8690e46d1c4890847ebe97ee0b4e36a979b41168c30586ee4
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build Selective Render
        shell: bash
        run: |
          chmod +x gradlew versions/mc26.1/gradlew versions/mc26.2/gradlew versions/mc26.3/gradlew
          ${{ matrix.build }}

      - name: Stage Selective Render and Sodium
        shell: bash
        run: |
          mkdir -p run/mods
          jar=$(find '${{ matrix.jar_dir }}' -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar"
          cp "$jar" run/mods/
          if [[ -n '${{ matrix.sodium }}' ]]; then
            curl --fail --location --retry 3 --retry-all-errors \
              --output "run/mods/sodium-${{ matrix.sodium }}.jar" \
              "https://api.modrinth.com/maven/maven/modrinth/sodium/${{ matrix.sodium }}/sodium-${{ matrix.sodium }}.jar"
          fi

      - name: Stage shared 26.1.x Fabric API
        if: matrix.fabric_api_minecraft
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors --output run/mods/fabric-api.jar \
            'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/${{ matrix.fabric_api }}+${{ matrix.fabric_api_minecraft }}/fabric-api-${{ matrix.fabric_api }}+${{ matrix.fabric_api_minecraft }}.jar'

      - name: Stage optional WorldEdit compatibility profile
        if: matrix.worldedit_url
        shell: bash
        env:
          WORLDEDIT_URL: ${{ matrix.worldedit_url }}
          WORLDEDIT_SHA: ${{ matrix.worldedit_sha }}
        run: |
          curl --fail --location --retry 3 --retry-all-errors --output run/mods/worldedit.jar "$WORLDEDIT_URL"
          echo "$WORLDEDIT_SHA  run/mods/worldedit.jar" | sha512sum --check
          if [[ '${{ matrix.profile }}' == 'worldedit-cui' ]]; then
            curl --fail --location --retry 3 --retry-all-errors --output run/mods/worldeditcui.jar \
              'https://cdn.modrinth.com/data/NSLJJooQ/versions/2tNTyKzy/WorldEditCUI-1.20%2B01.jar'
            echo '69bc3930d79b440ce39e135739970ce9e94fa0aea9fb10b0a4b136b0983f5e8a691d926c9d693c905a6f1822a32564bfd5127056acb14a7d9082862e840cd88c  run/mods/worldeditcui.jar' | sha512sum --check
          fi

      - name: Stage connected-texture compatibility profile
        if: matrix.profile == 'connected-textures'
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors --output run/mods/continuity.jar 'https://cdn.modrinth.com/data/1IjD5062/versions/qGTDcjHM/continuity-3.0.0%2B1.20.1.jar'
          echo '7205cae3c534fd5d5328a9659146911381c06e54da995aabd11745ad72def5bd5120b7cb792fab2e8dcaa4670c23bdba21079b8f6da94152cfc6ea4b415edcbf  run/mods/continuity.jar' | sha512sum --check
          curl --fail --location --retry 3 --retry-all-errors --output run/mods/indium.jar 'https://cdn.modrinth.com/data/Orvt0mRa/versions/nQHYSjxO/indium-1.0.36%2Bmc1.20.1.jar'
          echo '7c5a1851f1fc08ae69318e151d07151fabba6cda2a24616c9251e1a4e5b969453e88b97d60f926271d60e3511bfc6fa05a64a108466efb7f29bec4519547e0c9  run/mods/indium.jar' | sha512sum --check
          curl --fail --location --retry 3 --retry-all-errors --output run/mods/iris.jar 'https://cdn.modrinth.com/data/YL57xq9U/versions/s5eFLITc/iris-1.7.6%2Bmc1.20.1.jar'
          echo 'f1337b0441c31269bd3bfcb28647d521326a83e73128c1ac8d065615f8a5a4ca1e8c96a468b356584236ece5b164ec8d8a52b1878064f4e391ecf4f32885e301  run/mods/iris.jar' | sha512sum --check
          python3 .github/scripts/prepare-boundary-smoke-pack.py run

      - name: Set visual test viewport
        shell: bash
        run: |
          mkdir -p run
          cat <<EOF >> run/options.txt
          overrideWidth:1280
          overrideHeight:720
          guiScale:2
          tutorialStep:none
          EOF

      - name: Start client and join a singleplayer world
        env:
          JAVA_TOOL_OPTIONS: -Dselectiverender.performance.auto=true -Dselectiverender.boundary.smoke=true -Dselectiverender.visual.smoke=${{ needs.test-plan.outputs.visual == 'true' && matrix.profile == 'baseline' }} -Dselectiverender.visual.uiOnly=${{ inputs.visual != true }} -Dselectiverender.ctm.smoke=${{ matrix.profile == 'connected-textures' }}
        uses: headlesshq/mc-runtime-test@fbafe02f89f4f13682e7b16dbcee6b6a43f4faca # 4.5.1
        with:
          mc: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          modloader: fabric
          regex: .*fabric.*
          mc-runtime-test: fabric
          fabric-api: ${{ matrix.fabric_api_minecraft && 'none' || matrix.fabric_api }}
          cache-mc: github
          xvfb: true

      - name: Check WorldEdit adapter initialization
        shell: bash
        run: |
          if ! grep -q '\[SR performance\] START' run/logs/latest.log; then
            echo "Performance diagnostics did not initialize after joining the test world." >&2
            exit 1
          fi
          if ! grep -q '\[SR boundary smoke\] PASS' run/logs/latest.log; then
            echo "Boundary color/texture/opacity runtime smoke did not complete." >&2
            exit 1
          fi
          if ! grep -q '\[SR palette smoke\] Global alpha 0/1/25/50/75/99/100 and stable rainbow UVs verified' run/logs/latest.log; then
            echo "Global color opacity/rainbow runtime checks did not complete." >&2
            exit 1
          fi
          grep -q '\[SR grid smoke\] PASS:' run/logs/latest.log
          grep -q '\[SR plot parity smoke\] PASS:' run/logs/latest.log
          grep -q '\[SR skylight budget smoke\] PASS:' run/logs/latest.log
          grep -q '\[SR reset smoke\] Two clicks clear overrides/filters and preserve region geometry/type/activation' run/logs/latest.log
          if ! grep -q '\[SR placement smoke\] Only-filtered air permits placement' run/logs/latest.log; then
            echo "Only-filter placement runtime smoke did not complete." >&2
            exit 1
          fi
          if ! grep -q '\[SR region smoke\] Independent texture/color persisted without changing global defaults' run/logs/latest.log; then
            echo "Regional boundary appearance persistence/rendering smoke did not complete." >&2
            exit 1
          fi
          if ! grep -q '\[SR filter smoke\] Filter-only roofs admit skylight and entity targeting respects hidden interactions' run/logs/latest.log; then
            echo "Filter-only lighting/entity interaction runtime smoke did not complete." >&2
            exit 1
          fi
          if ! grep -q '\[SR region smoke\] Config validation never changes live region options' run/logs/latest.log; then
            echo "Region config isolation runtime smoke did not complete." >&2
            exit 1
          fi
          if ! grep -q '\[SR menu smoke\] Regional Color Off removes all palette rows and widgets' run/logs/latest.log; then
            echo "Regional boundary toggle/inheritance runtime smoke did not complete." >&2
            exit 1
          fi
          if [[ '${{ matrix.profile }}' == 'connected-textures' ]] && ! grep -q '\[SR CTM smoke\] Loaded resourcepack connected tile resolved' run/logs/latest.log; then
            echo "Connected-texture resourcepack runtime smoke did not complete." >&2
            exit 1
          fi
          if [[ '${{ matrix.profile }}' == 'connected-textures' ]]; then
            grep -q '\[SR CTM smoke\] Active outer context preserved' run/logs/latest.log
            grep -q '\[SR CTM smoke\] Distinct 8x8 repeat tiles and period verified' run/logs/latest.log
            grep -q '\[SR CTM smoke\] Nested terrain faces resolved' run/logs/latest.log
          fi
          if grep -E 'WorldEdit selection synchronization unavailable|Could not initialize WorldEdit selection synchronization' run/logs/latest.log; then
            echo "The WorldEdit adapter failed to initialize." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: always() && needs.test-plan.outputs.visual == 'true' && matrix.profile == 'baseline'
        with:
          python-version: '3.12'

      - name: Build offline gallery and check rendered pixels
        if: always() && needs.test-plan.outputs.visual == 'true' && matrix.profile == 'baseline'
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-visual-report.py
          extra=()
          if [[ '${{ matrix.profile }}' == 'baseline' ]]; then
            extra+=(--require-visual)
            if [[ '${{ inputs.visual }}' != 'true' ]]; then extra+=(--ui-only); fi
          fi
          python3 .github/scripts/visual-report.py run --version '${{ matrix.minecraft }}' --profile '${{ matrix.profile }}' "${extra[@]}"

      - name: Upload client logs and screenshots
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-smoke-${{ matrix.minecraft }}-${{ matrix.profile }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            run/logs/
            run/crash-reports/
            run/screenshots/
            run/index.html
            run/visual-results.json

      - name: Link screenshot review package
        if: always()
        shell: bash
        run: |
          echo '### Minecraft ${{ matrix.minecraft }} / ${{ matrix.profile }}' >> "$GITHUB_STEP_SUMMARY"
          echo '[Download test evidence](${{ steps.evidence.outputs.artifact-url }}) — logs are always included; screenshot runs also contain index.html. Automatically expires after seven days.' >> "$GITHUB_STEP_SUMMARY"
