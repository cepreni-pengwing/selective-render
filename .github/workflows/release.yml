name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate tag version
        shell: bash
        run: |
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          tag_version=${GITHUB_REF_NAME#v}
          if [[ -z "$project_version" || "$tag_version" != "$project_version" ]]; then
            echo "Tag version '$tag_version' does not match mod_version '$project_version'." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            echo "Tagged commit '$GITHUB_SHA' is not based on the current origin/main history." >&2
            exit 1
          fi
      - run: ./gradlew clean build --stacktrace
      - name: Read optional release targets
        id: targets
        shell: bash
        run: |
          mc26_2=$(sed -n 's/^release_mc26_2=//p' gradle.properties | tr -d '\r')
          echo "mc26_2=${mc26_2:-false}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.targets.outputs.mc26_2 == 'true'
        with:
          distribution: temurin
          java-version: '25'
      - run: chmod +x versions/mc26.2/gradlew
        if: steps.targets.outputs.mc26_2 == 'true'
      - run: ./versions/mc26.2/gradlew -p versions/mc26.2 clean build --stacktrace
        if: steps.targets.outputs.mc26_2 == 'true'
      - name: Publish versioned JARs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar_1201=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$jar_1201"
          assets=("$jar_1201")
          if [[ '${{ steps.targets.outputs.mc26_2 }}' == 'true' ]]; then
            jar_262=$(find versions/mc26.2/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
            test -n "$jar_262"
            assets+=("$jar_262")
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag --prerelease
