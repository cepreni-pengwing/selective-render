name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Validate tag version
        shell: bash
        run: |
          project_version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          tag_version=${GITHUB_REF_NAME#v}
          if [[ -z "$project_version" || "$tag_version" != "$project_version" ]]; then
            echo "Tag version '$tag_version' does not match mod_version '$project_version'." >&2
            exit 1
          fi
      - run: ./gradlew clean build --stacktrace
      - name: Publish tagged JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          gh release create "$GITHUB_REF_NAME" "$jar" --generate-notes --verify-tag --prerelease
