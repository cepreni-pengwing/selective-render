name: Release

on:
  workflow_run:
    workflows: [Client Smoke Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Determine version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid mod_version '$version'" >&2; exit 1; }
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v6
        if: steps.version.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
        if: steps.version.outputs.exists == 'false'
      - if: steps.version.outputs.exists == 'false'
        run: ./gradlew build -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 --stacktrace
      - name: Publish prerelease
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          mapfile -t assets < <(find versions/*/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' | sort)
          test "${#assets[@]}" -eq 5
          previous=$(git describe --tags --abbrev=0 "$SHA" 2>/dev/null || true)
          awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md | sed '/^$/d' > notes.md
          [[ -s notes.md ]] && echo >> notes.md
          if [[ -n "$previous" ]]; then
            printf '**Full Changelog**: [%s...%s](https://github.com/%s/compare/%s...%s)\n' "$previous" "$TAG" "$GITHUB_REPOSITORY" "$previous" "$TAG" >> notes.md
          else
            printf '**Full Changelog**: [Commits](https://github.com/%s/commits/%s)\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md
          fi
          gh release create "$TAG" "${assets[@]}" --target "$SHA" --title "$TAG" --notes-file notes.md --prerelease
