name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAINS: -Porg.gradle.java.installations.auto-detect=false -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release version format
        run: grep -Eq '^mod_version=[0-9]+\.[0-9]+\.[0-9]+$' gradle.properties
      - name: Check sources and docs
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/check-sources.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-visual-selection.py
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-beam-catalog.py
      - run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-visual-report.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build ${{ env.TOOLCHAINS }} --continue --stacktrace 2>&1 | tee build.log
        shell: bash
      - if: failure()
        run: python3 .github/scripts/ci-summary.py build.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: selective-render-jars
          path: |
            versions/*/build/libs/*.jar
            !versions/*/build/libs/*-sources.jar

  sodium-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1.20.1
            sodium: mc1.20.1-0.5.8
          - target: mc1.20.1
            sodium: mc1.20.1-0.5.11
          - target: mc26.1
            sodium: mc26.1.1-0.8.9-fabric
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :${{ matrix.target }}:build -P${{ matrix.target }}.sodium_version=${{ matrix.sodium }} ${{ env.TOOLCHAINS }} --stacktrace 2>&1 | tee build.log
        shell: bash
      - if: failure()
        run: python3 .github/scripts/ci-summary.py build.log >> "$GITHUB_STEP_SUMMARY"
