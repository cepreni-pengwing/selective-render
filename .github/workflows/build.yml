name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-1-20-1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sodium:
          - mc1.20.1-0.5.8
          - mc1.20.1-0.5.11
          - mc1.20.1-0.5.13-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build -Psodium_version=${{ matrix.sodium }} --stacktrace
      - uses: actions/upload-artifact@v4
        if: matrix.sodium == 'mc1.20.1-0.5.13-fabric'
        with:
          name: selective-render-mc1.20.1
          path: build/libs/*.jar
  build-1-21-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew -p versions/mc1.21.1 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: selective-render-mc1.21.1
          path: versions/mc1.21.1/build/libs/*.jar
  build-26-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x versions/mc26.2/gradlew
      - run: ./versions/mc26.2/gradlew -p versions/mc26.2 build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: selective-render-mc26.2
          path: versions/mc26.2/build/libs/*.jar
