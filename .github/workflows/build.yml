name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sodium:
          - mc1.20.1-0.5.8
          - mc1.20.1-0.5.11
          - mc1.20.1-0.5.13-fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build -Psodium_version=${{ matrix.sodium }} --stacktrace
      - uses: actions/upload-artifact@v4
        if: matrix.sodium == 'mc1.20.1-0.5.13-fabric'
        with:
          name: selective-render
          path: build/libs/*.jar
