plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

apply from: rootProject.file('gradle/target.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixinextras_version}")
    include "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"
    modCompileOnly "maven.modrinth:sodium:${sodium_version}"
    modLocalRuntime "maven.modrinth:sodium:${sodium_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}
