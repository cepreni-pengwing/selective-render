plugins {
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/target.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "maven.modrinth:sodium:${sodium_version}"
    compileOnly "maven.modrinth:modmenu:${modmenu_version}"
    compileOnly "maven.modrinth:N6n5dqoA:${axiom_version}"
    compileOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}
